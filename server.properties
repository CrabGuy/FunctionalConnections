# Server TCP port for client connections
server.tcp.port=8080

# UDP port for broadcasting game updates
server.udp.port=9876

# Duration of a single game in seconds (default: 10 minutes)
server.game.duration.seconds=600

# Maximum mistakes allowed per player in one game
server.max.mistakes=4

# Interval in seconds between automatic saves
server.save.interval.seconds=30

# Directory where persistent data is stored (relative to working directory)
server.storage.dir=storage

# Path to the puzzle data JSON file
server.puzzle.file=Connections_Data.json

# Maximum number of recent games kept in memory
server.max.in.memory.games=10