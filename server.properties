# Server TCP listen port
server.port=8080

# Number of threads in the connection handling pool
connection.pool.size=10

# Duration of a single game in milliseconds (1 hour)
game.duration.millis=3600000

# JWT secret key (MANDATORY – replace with a strong secret)
jwt.secret=change-me-to-a-random-secret

# JWT token expiry time in milliseconds (24 hours)
token.expiry.millis=86400000

# Path to the JSON file containing game word groups
game.data.file=Connections_Data.json

# Directory where persistence snapshots are stored
storage.directory=.

# Interval between automatic snapshot saves in milliseconds (1 minute)
snapshot.interval.millis=60000

# Polling interval for the game transition watcher in milliseconds (1 second)
transition.poll.interval.millis=1000